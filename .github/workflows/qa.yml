name: Facilities Desk QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qa:
    name: Required functional QA
    # Fork PRs receive no secrets, so QA cannot authenticate there.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Check out branch code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read QA runtime switches
        id: qa-config
        shell: bash
        run: |
          echo "imagemagick=$(awk '/^imagemagick:/{print $2;exit}' .factory/skills/qa/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "video=$(awk '/^video_evidence:/{print $2;exit}' .factory/skills/qa/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "compose=$(awk '/^droid_control:/{found=1;next} found && /^  compose:/{print $2;exit}' .factory/skills/qa/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Install ImageMagick
        if: steps.qa-config.outputs.imagemagick == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Install video capture tools
        if: steps.qa-config.outputs.video == 'true' || steps.qa-config.outputs.compose == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Compose renderer prerequisites
        if: steps.qa-config.outputs.video == 'true' && steps.qa-config.outputs.compose == 'true'
        run: sudo apt-get install -y -qq clang libclang-dev libx264-dev

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the branch application
        id: build
        continue-on-error: true
        run: mvn --batch-mode -q package -DskipTests

      - name: Install Droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.factory/bin" >> "$GITHUB_PATH"

      - name: Run diff-targeted Factory QA
        id: functional-qa
        continue-on-error: true
        timeout-minutes: 25
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          QA_EVIDENCE_TOKEN: ${{ secrets.QA_EVIDENCE_TOKEN }}
          REPO_ID: ${{ github.event.repository.id }}
          RUN_ID: ${{ github.run_id }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        shell: bash
        run: |
          mkdir -p qa-results
          VIDEO_INSTRUCTION=""
          if [[ "${{ steps.qa-config.outputs.video }}" == "true" ]]; then
            VIDEO_INSTRUCTION="Use droid-control Capture and upload video evidence per the qa skill's Evidence Capture rules."
          fi
          COMPOSE_INSTRUCTION=""
          if [[ "${{ steps.qa-config.outputs.video }}" == "true" && "${{ steps.qa-config.outputs.compose }}" == "true" ]]; then
            COMPOSE_INSTRUCTION="Run droid-control Compose for each captured flow before upload."
          fi
          set +e
          droid exec --auto high \
            "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, and do NOT pause for input. Run the qa skill against the checked-out branch. Analyze the diff from ${DIFF_BASE}. The branch application is prebuilt at target/facilities-desk.jar. Write the final report to qa-results/report.md. ${VIDEO_INSTRUCTION} ${COMPOSE_INSTRUCTION}" \
            2>&1 | tee qa-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.run_number }}
          path: |
            qa-results/
            qa-output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Post or update the QA report
        if: always() && github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- qa-report -->';
            let report = '## QA Report\n\n:no_entry: QA did not produce a report. Review the workflow log.';
            if (fs.existsSync('qa-results/report.md')) {
              report = fs.readFileSync('qa-results/report.md', 'utf8').trim();
              if (!report.startsWith('## QA Report')) report = `## QA Report\n\n${report}`;
            } else if (fs.existsSync('qa-output.txt')) {
              const output = fs.readFileSync('qa-output.txt', 'utf8').slice(-12000);
              report += `\n\n<details><summary>QA output</summary>\n\n\`\`\`text\n${output}\n\`\`\`\n\n</details>`;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${report}\n\n---\n\n[Workflow run and downloadable evidence](${runUrl})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce the required QA gate
        if: always()
        shell: bash
        run: |
          failed=0
          for outcome in "${{ steps.build.outcome }}" "${{ steps.functional-qa.outcome }}"; do
            if [[ "$outcome" != "success" ]]; then failed=1; fi
          done
          if [[ ! -f qa-results/report.md ]]; then failed=1; fi
          if [[ -f qa-results/report.md ]] && grep -Eq '^\|.*(:x: FAIL|:no_entry: BLOCKED)' qa-results/report.md; then
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            echo "Functional QA failed or was blocked. Review the QA report and artifacts."
            exit 1
          fi
